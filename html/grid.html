<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid test</title>
  <style>
    * { box-sizing: border-box; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #ddd;
      padding: 10px;
    }
    .box { background: tomato; color: white; padding: 20px; }
    .box:first-child { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
  </div>
</body>
</html>
